<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дейности</title>
<style>
  :root { --bg:#f7f5f0; --ink:#1f1f1f; --muted:#6b6b6b; --line:#d9d5cc; --accent:#E37424; --panel:#fff; --bad:#b3261e; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; padding:12px; background:var(--bg); color:var(--ink); font:13px/1.45 Ubuntu, "Segoe UI", system-ui, sans-serif; }
  h1 { font-size:15px; margin:0; font-weight:600; }
  h2 { font-size:12px; margin:16px 0 6px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .top { display:flex; align-items:center; gap:8px; margin-bottom:2px; }
  .top h1 { margin-right:auto; }
  .status { font-size:12px; color:var(--muted); margin-bottom:8px; min-height:1.4em; }
  .status.bad { color:var(--bad); }
  .box { background:var(--panel); border:1px solid var(--line); padding:10px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:6px 0; }
  button { font:inherit; padding:6px 10px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; border-radius:0; min-height:28px; }
  button.secondary { background:transparent; color:var(--ink); border-color:var(--line); }
  button.small { padding:2px 8px; font-size:12px; min-height:24px; }
  button:disabled { opacity:.5; cursor:default; }
  select { font:inherit; font-size:12px; padding:2px 4px; border:1px solid var(--line); background:#fff; border-radius:0; }
  label.chk { display:inline-flex; align-items:center; gap:5px; font-size:12px; }
  .sub { font-size:11px; color:var(--muted); }
  .fld { display:block; font-size:12px; color:var(--muted); margin:6px 0 3px; }
  input[type=text], input[type=date] { font:inherit; padding:6px; border:1px solid var(--line); background:#fff; border-radius:0; }
  input[type=text] { width:100%; }
  #form.editing { border-color:var(--accent); background:#FFF8F2; }
  .photoPick { display:inline-flex; align-items:center; gap:6px; font-size:12px; cursor:pointer; border:1px dashed var(--line); padding:4px 8px; background:#fff; }
  .photoPick input { display:none; }
  /* the list, by week */
  .wk { margin-top:14px; }
  .wk h2 { margin:0 0 6px; }
  .act { list-style:none; margin:0; padding:0; }
  .act > li { background:var(--panel); border:1px solid var(--line); border-top:0; padding:8px 10px; }
  .act > li:first-child { border-top:1px solid var(--line); }
  .act > li.open .d { color:var(--accent); }
  .act > li.editing { background:#FFF4EA; }
  .act .hd { display:flex; gap:8px; align-items:baseline; }
  .act .d { flex:none; width:78px; font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; }
  .act .txt { flex:1; min-width:0; overflow-wrap:anywhere; }
  .act .acts { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0 0 86px; }
  .act .acts button { padding:2px 8px; font-size:11px; min-height:24px; }
  .act .acts .cl { align-self:center; margin-right:2px; }
  .act .acts .cl.on { color:var(--ink); font-weight:600; }
  .act .acts button.del { margin-left:auto; }   /* away from "+ снимка" */
  /* additional works (ДР): number, status chip, drawing / place / quantity line */
  .kind { display:flex; gap:0; margin-bottom:4px; }
  .kind button { flex:1; }
  #extraBox .grid { display:grid; grid-template-columns:1fr 1fr; gap:4px 8px; }
  #extraBox .grid > div { min-width:0; }
  #extraBox input[type=text], #extraBox select { width:100%; }
  .act .no { font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .st { display:inline-block; font-size:11px; padding:0 6px; border:1px solid var(--line); background:#f1eee8; white-space:nowrap; }
  .st-pending { background:#FFF4E5; border-color:#E8B66A; }
  .st-approved { background:#EAF3FB; border-color:#8FB3D9; }
  .st-doing { background:#FDEBDD; border-color:var(--accent); }
  .st-done { background:#E8F5E9; border-color:#81C784; }
  .st-rejected { background:#f3f3f3; color:var(--muted); text-decoration:line-through; }
  button.st { font-size:12px; text-decoration:none; color:var(--ink); }
  button.st[aria-pressed="true"] { outline:2px solid var(--ink); }
  .act .meta { margin:2px 0 0 86px; }
  .act .acts a.btnlink { display:inline-flex; align-items:center; padding:2px 8px; font-size:11px; min-height:24px; border:1px solid var(--line); color:var(--ink); text-decoration:none; background:#fff; }
  #viewBar { margin-top:14px; }
  #printReg { display:none; }
  @media print {
    body { padding:0; background:#fff; }
    body > *:not(#printReg) { display:none !important; }
    #printReg { display:block !important; }
    #printReg table { width:100%; border-collapse:collapse; font-size:11px; }
    #printReg th, #printReg td { border:1px solid #999; padding:3px 5px; text-align:left; vertical-align:top; }
    #printReg tr { break-inside:avoid; }
  }
  /* the inline question under a row (sweep 18.11.2026): window.confirm can be blocked in Connect's frame / a phone webview */
  .act .ask { margin:6px 0 0 86px; padding:6px 8px; border:1px solid var(--bad); background:#fdf0ef; white-space:pre-line; }
  .act .ask .acts { margin:6px 0 0 0; }
  .act .ask button.go { background:var(--bad); border-color:var(--bad); color:#fff; }
  /* result of a write at the bottom, near the finger (as pour-status): always in the DOM for screen readers, visually
     hidden when idle; taps pass through */
  body { padding-bottom:calc(48px + env(safe-area-inset-bottom, 0px)); }
  .toast { position:fixed; left:8px; bottom:calc(8px + env(safe-area-inset-bottom, 0px)); z-index:20; max-width:min(80%, 420px);
    padding:8px 10px; font-size:13px; color:#fff; pointer-events:none; }
  .toast:not(.show) { width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; }
  .toast.ok { background:#2e7d32; }
  .toast.bad { background:var(--bad); }
  /* touch screens (sweep 18.11.2026, as pour-status A1): ~40 px targets, 16 px inputs (no iOS zoom on focus) */
  @media (pointer: coarse) {
    button, button.small, select, input[type=date], input[type=text] { min-height:40px; }
    button.small, .act .acts button { padding:6px 12px; font-size:14px; min-height:40px; }
    select, input[type=date], input[type=text] { font-size:16px; padding:6px 8px; }
    input[type=checkbox] { width:22px; height:22px; }
    label.chk, .photoPick { min-height:40px; font-size:14px; }
    .bar, .act .acts { gap:8px; }
    .thumb button { min-width:32px; min-height:32px; line-height:30px; }
    .act .acts a.btnlink { min-height:40px; padding:6px 12px; font-size:14px; }
    input[type=number] { min-height:40px; font-size:16px; }
  }
  .thumbs { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 0 86px; }
  .thumb { position:relative; width:72px; height:72px; background:#ece8df; border:1px solid var(--line); }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in; }
  .thumb button { position:absolute; top:-6px; right:-6px; min-width:24px; min-height:24px; padding:0; line-height:22px; font-size:14px; background:#fff; }
  /* picked photos in the form (sweep 18.11.2026): 56 px previews, each with × */
  .thumbs.picked { margin:6px 0 0 0; }
  .thumbs.picked .thumb { width:56px; height:56px; }
  /* a row: the state chip left, its one button and "Още…" right; the other actions under it when opened */
  .act .acts .cl { margin-right:auto; }
  .act .acts.extra { margin-top:4px; }
  @media (max-width:360px) { .act .acts, .thumbs, .act .ask, .act .meta { margin-left:0; } .act .d { width:70px; } }
  input[type=number] { font:inherit; padding:6px; border:1px solid var(--line); background:#fff; border-radius:0; width:100%; }
  /* full-size photo */
  #viewer { position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; align-items:center; justify-content:center; z-index:10; }
  #viewer img { max-width:96vw; max-height:90vh; }
  #viewer button { position:absolute; top:8px; right:8px; min-height:36px; padding:6px 14px; }
</style>
</head>
<body>
<div class="top"><h1 id="title">Дейности</h1>
  <button type="button" id="btnRefresh" class="small secondary">Обнови</button>
  <select id="selLang" title="Language / Език"><option value="bg">BG</option><option value="en">EN</option></select></div>
<button type="button" class="small secondary" data-arsten-diag style="float:right;margin-left:6px">Копирай диагностика</button>
<div id="status" class="status">Trimble Connect…</div>

<div id="main" hidden>
  <div class="sub" id="hint"></div>
  <div class="box" id="form" style="margin-top:8px">
    <div class="kind" id="kindBar" role="group"><button type="button" id="btnKindAct" class="small"></button><button type="button" id="btnKindExtra" class="small secondary"></button></div>
    <label class="fld" for="inText" id="lblText"></label>
    <input type="text" id="inText" maxlength="200">
    <label class="fld" for="inDate" id="lblDate"></label>
    <div class="bar" style="margin-top:0">
      <input type="date" id="inDate">
      <label class="chk"><input type="checkbox" id="chkPlanned"> <span id="lblPlanned"></span></label>
    </div>
    <div id="extraBox" hidden>
      <div class="grid">
        <div><label class="fld" for="inQty" id="lblQty"></label><input type="text" id="inQty" inputmode="decimal" maxlength="14" autocomplete="off"></div>
        <div><label class="fld" for="selUnit" id="lblUnit"></label><select id="selUnit"></select></div>
        <div><label class="fld" for="inSheet" id="lblSheet"></label><input type="text" id="inSheet" maxlength="60" autocomplete="off"></div>
        <div><label class="fld" for="inPage" id="lblPage"></label><input type="text" id="inPage" inputmode="numeric" maxlength="4" autocomplete="off"></div>
      </div>
      <label class="fld" for="inWhere" id="lblWhere"></label><input type="text" id="inWhere" maxlength="120" autocomplete="off">
      <label class="fld" for="selTodo" id="lblTodo"></label>
      <div class="bar" style="margin:0;flex-wrap:nowrap"><select id="selTodo" style="flex:1;min-width:0"></select><button type="button" id="btnTodoReload" class="small secondary"></button></div>
      <label class="fld" for="inLink" id="lblLink"></label><input type="text" id="inLink" inputmode="url" maxlength="500" autocomplete="off" spellcheck="false">
      <div class="sub" id="linkHint"></div>
    </div>
    <div class="bar">
      <label class="chk"><input type="checkbox" id="chkClient"> <span id="lblClient"></span></label>
      <label class="photoPick" id="lblPhotos"><input type="file" id="inPhotos" accept="image/*" multiple><span id="txtPhotos"></span></label>
    </div>
    <div class="sub" id="clientHint"></div>
    <div class="sub" id="pickInfo"></div>
    <div class="thumbs picked" id="pickList" hidden></div>
    <div class="bar" style="margin-bottom:0"><button id="btnSave"></button><button id="btnCancel" class="secondary" hidden></button></div>
  </div>
  <input type="file" id="inMore" accept="image/*" multiple hidden>
  <div class="bar" id="viewBar" hidden><button type="button" id="btnViewAll" class="small"></button><button type="button" id="btnViewExtra" class="small secondary"></button></div>
  <div id="regBar" hidden>
    <div class="bar" id="regOrphans" hidden></div>
    <div class="bar" id="regChips"></div>
    <div class="sub" id="regSum"></div>
    <div class="bar"><button type="button" id="btnCsv" class="small secondary"></button><button type="button" id="btnPrint" class="small secondary"></button></div>
  </div>
  <div id="list"></div>
  <div class="bar"><button id="btnOlder" class="small secondary" hidden></button></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="printReg"></div>
<div id="viewer" hidden><img id="viewerImg" alt=""><button id="btnViewerClose" class="small secondary" style="background:#fff"></button></div>

<script src="https://cdn.jsdelivr.net/npm/trimble-connect-workspace-api@0.3.38/dist/iife/trimbleconnect.workspace.api.js" integrity="sha384-lFiNt/56q6HnUNbuy0WHO3NP6BkQjY4EH8+5eELYVfnhkB42snRTmSa3UOAlX9gg" crossorigin="anonymous"></script>
<script src="arsten-perf.js?v=21f7454938"></script>
<script src="arsten-diag.js?v=bb0c6351fe"></script>
<script src="arsten-i18n.js?v=c58f01c9fc"></script>
<script src="arsten-access.js?v=fad565fcbe"></script>
<script src="arsten-backup.js?v=6c54dfe763"></script>
<script src="arsten-photos.js?v=58db357146"></script>
<script src="arsten-activities.js?v=61c84547b9"></script>
<script src="app.js?v=2687e87833"></script>
</body>
</html>
